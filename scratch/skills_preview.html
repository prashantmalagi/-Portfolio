          },

            glowPulse: {
              '0%, 100%': { opacity: '0.3', transform: 'scale(1)' },
              '50%': { opacity: '0.6', transform: 'scale(1.05)' },
            },
            floatSlow: {
              '0%, 100%': { transform: 'translateY(0px)' },

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <style>

      background-color: #060913;
      color: #F8FAFC;
      margin: 0;
      padding: 0;

    }

</head>

          { name: "Tailwind CSS", icon: "devicon-tailwindcss-plain colored", desc: "Utility-First, Custom Themes", highlight: true },
          { name: "HTML5", icon: "devicon-html5-plain colored", desc: "Semantic Markup, Accessibility", highlight: false },
          { name: "CSS3", icon: "devicon-css3-plain colored", desc: "Flexbox, Grid, Custom Properties", highlight: false },

      {

        icon: "devicon-nodejs-plain colored",

        ]

      {

        description: "Managing structured and unstructured data with efficient queries and schema design.",
        badge: "Data Storage",
        icon: "devicon-postgresql-plain colored",

          { name: "MySQL", icon: "devicon-mysql-plain colored", desc: "Relational Queries, Indexing", highlight: true },
          { name: "MongoDB", icon: "devicon-mongodb-plain colored", desc: "NoSQL Documents, Aggregations", highlight: true },
          { name: "PostgreSQL", icon: "devicon-postgresql-plain colored", desc: "ACID Compliance, Complex Queries", highlight: true },
          { name: "SQLite", icon: "devicon-sqlite-plain colored", desc: "Embedded Data Storage", highlight: false }
        ]
      },
      {

        description: "Version control, build automation, analytics tools, and modern IDE workflows.",
        badge: "DevOps & Tools",
        icon: "devicon-git-plain colored",
        gridSpan: "col-span-12 md:col-span-6 lg:col-span-7",
        skills: [
          { name: "Git", icon: "devicon-git-plain colored", desc: "Version Control, Branching", highlight: true },
          { name: "GitHub", icon: "devicon-github-original", desc: "Pull Requests, CI/CD, Actions", highlight: true },

          { name: "Power BI", icon: "devicon-windows8-original colored", desc: "Data Visualization & Dashboards", highlight: false },
          { name: "Excel", icon: "devicon-[#107C41] devicon-python-plain colored", desc: "Data Analysis & Formulas", highlight: false }
        ]

      {

        title: "Core CS Fundamentals",
        description: "Theoretical foundation forming the backbone of clean, optimized software engineering.",

        skills: [
          { name: "Data Structures & Algorithms", icon: "devicon-cplusplus-plain colored", desc: "Trees, Graphs, Sorting, Dynamic Programming", highlight: true },
          { name: "Object-Oriented Programming", icon: "devicon-java-plain colored", desc: "Encapsulation, Inheritance, Polymorphism", highlight: true },
          { name: "DBMS", icon: "devicon-postgresql-plain colored", desc: "Normalization, Transactions, ER Diagrams", highlight: false },
          { name: "Operating Systems", icon: "devicon-linux-plain colored", desc: "Processes, Threads, Memory Management", highlight: false },
          { name: "Computer Networks", icon: "devicon-chrome-plain colored", desc: "TCP/IP, HTTP/S, DNS, Sockets", highlight: false },

        ]
      }
    ];

    // Card Component with 3D Tilt and Glow
    function SkillBentoCard({ category, index, activeFilter }) {
      const cardRef = useRef(null);
      const [transform, setTransform] = useState("perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)");
      const [glowPos, setGlowPos] = useState({ x: 50, y: 50 });
      const [isHovered, setIsHovered] = useState(false);

      const handleMouseMove = (e) => {
        if (!cardRef.current) return;
        const rect = cardRef.current.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        
        const centerX = rect.width / 2;
        const centerY = rect.height / 2;
        
        const rotateX = ((y - centerY) / centerY) * -6; // max 6deg
        const rotateY = ((x - centerX) / centerX) * 6;  // max 6deg

        setTransform(`perspective(1000px) rotateX(${rotateX.toFixed(2)}deg) rotateY(${rotateY.toFixed(2)}deg) scale3d(1.015, 1.015, 1.015)`);
        setGlowPos({ x: (x / rect.width) * 100, y: (y / rect.height) * 100 });
      };

      const handleMouseEnter = () => setIsHovered(true);
      const handleMouseLeave = () => {
        setIsHovered(false);
        setTransform("perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)");
      };

      const isHidden = activeFilter !== 'all' && activeFilter !== category.id;

      if (isHidden) return null;

      return (
        <div 
          ref={cardRef}
          onMouseMove={handleMouseMove}
          onMouseEnter={handleMouseEnter}
          onMouseLeave={handleMouseLeave}
          style={{ transform, transition: isHovered ? "transform 0.1s ease-out" : "transform 0.5s ease-out" }}
          className={`${category.gridSpan} group relative rounded-2xl p-6 transition-all duration-300 bg-[#0d1527]/80 backdrop-blur-xl border border-white/10 hover:border-purple-500/50 shadow-xl overflow-hidden`}
        >
          {/* Dynamic Spotlight Glow Effect */}
          <div 
            className="pointer-events-none absolute -inset-px rounded-2xl opacity-0 group-hover:opacity-100 transition-opacity duration-500 z-0"
            style={{
              background: `radial-gradient(600px circle at ${glowPos.x}% ${glowPos.y}%, rgba(139, 92, 246, 0.15), transparent 40%)`
            }}
          />

          {/* Border highlight glow */}
          <div 
            className="pointer-events-none absolute -inset-px rounded-2xl opacity-0 group-hover:opacity-100 transition-opacity duration-500 z-0"
            style={{
              background: `radial-gradient(400px circle at ${glowPos.x}% ${glowPos.y}%, rgba(167, 139, 250, 0.4), transparent 40%)`,
              mask: 'linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0)',
              maskComposite: 'exclude',
              padding: '1px'
            }}
          />

          {/* Card Content */}
          <div className="relative z-10 flex flex-col h-full justify-between">
            <div>
              {/* Card Header */}
              <div className="flex items-center justify-between mb-4">
                <div className="flex items-center space-x-3">
                  <div className="w-10 h-10 rounded-xl bg-purple-950/60 border border-purple-500/30 flex items-center justify-center text-purple-400 group-hover:scale-110 group-hover:border-purple-400/80 transition-all duration-300 shadow-inner">
                    <i className={`${category.icon} text-xl`}></i>
                  </div>
                  <div>
                    <h3 className="text-xl font-bold text-white tracking-wide group-hover:text-purple-300 transition-colors">
                      {category.title}
                    </h3>
                  </div>
                </div>
                <span className="text-xs font-semibold px-2.5 py-1 rounded-full bg-purple-900/40 text-purple-300 border border-purple-500/20 tracking-wider uppercase">
                  {category.badge}
                </span>
              </div>

              <p className="text-slate-400 text-xs leading-relaxed mb-6">
                {category.description}
              </p>

              {/* Skills Chips Grid */}
              <div className="flex flex-wrap gap-2.5">
                {category.skills.map((skill, sIdx) => (
                  <div 
                    key={sIdx}
                    className={`group/chip relative flex items-center space-x-2 px-3.5 py-2 rounded-xl text-xs font-medium border transition-all duration-300 cursor-default ${
                      skill.highlight 
                        ? 'bg-purple-950/30 text-slate-200 border-purple-500/30 hover:border-purple-400 hover:bg-purple-900/40 hover:text-white hover:shadow-[0_0_15px_rgba(139,92,246,0.3)]' 
                        : 'bg-slate-900/60 text-slate-300 border-white/5 hover:border-slate-500 hover:bg-slate-800/60 hover:text-white'
                    }`}
                  >
                    <i className={`${skill.icon} text-base group-hover/chip:scale-125 transition-transform duration-300`}></i>
                    <span>{skill.name}</span>

                    {/* Interactive Micro Tooltip */}
                    <div className="absolute bottom-full left-1/2 -translate-x-1/2 mb-2 hidden group-hover/chip:flex flex-col items-center z-30 pointer-events-none">
                      <div className="bg-slate-900 text-purple-200 text-[10px] px-2.5 py-1 rounded-md shadow-2xl border border-purple-500/30 whitespace-nowrap">
                        {skill.desc}
                      </div>
                      <div className="w-2 h-2 bg-slate-900 rotate-45 -mt-1 border-r border-b border-purple-500/30"></div>
                    </div>
                  </div>
                ))}
              </div>
            </div>

            {/* Bottom Subtle Indicator */}
            <div className="mt-6 pt-4 border-t border-white/5 flex items-center justify-between text-[11px] text-slate-500">
              <span>{category.skills.length} Technologies</span>
              <span className="group-hover:text-purple-400 group-hover:translate-x-1 transition-all duration-300 flex items-center gap-1">
                Explore <svg className="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
              </span>
            </div>
          </div>
        </div>
      );
    }

    // Main Skills Section Component
    function SkillsSection() {

        { id: "backend", label: "Backend" },

      return (
        <section id="skills" className="relative py-24 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto overflow-hidden">
          {/* Floating Ambient Background Blobs */}
          <div className="absolute top-1/4 -left-20 w-96 h-96 bg-purple-600/10 rounded-full blur-3xl pointer-events-none animate-glow-pulse"></div>
          <div className="absolute bottom-10 -right-20 w-96 h-96 bg-indigo-600/10 rounded-full blur-3xl pointer-events-none animate-glow-pulse" style={{ animationDelay: '2s' }}></div>

          {/* Section Header */}
          <div className="text-center max-w-3xl mx-auto mb-12">
            <div className="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-purple-950/50 border border-purple-500/30 text-purple-300 text-xs font-semibold uppercase tracking-wider mb-4 shadow-lg shadow-purple-950/50">
              <span className="w-2 h-2 rounded-full bg-purple-400 animate-ping"></span>
              Technical Competence
            </div>
            
            <h2 className="text-4xl sm:text-5xl font-extrabold text-white tracking-tight mb-4">
              Skills & <span className="bg-gradient-to-r from-purple-400 via-pink-400 to-indigo-400 bg-clip-text text-transparent">Tech Stack</span>
            </h2>
            
            <p className="text-slate-400 text-base sm:text-lg">
              A comprehensive breakdown of tools, frameworks, and engineering principles I utilize to design and engineer scalable web solutions.
            </p>
          </div>

          {/* Interactive Category Filter Pills */}
          <div className="flex flex-wrap items-center justify-center gap-2 mb-12">
            {filters.map((filter) => (
              <button
                key={filter.id}
                onClick={() => setActiveFilter(filter.id)}
                className={`relative px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold transition-all duration-300 border ${
                  activeFilter === filter.id
                    ? 'bg-purple-600 text-white border-purple-400 shadow-[0_0_20px_rgba(139,92,246,0.5)] scale-105'
                    : 'bg-[#0d1527]/60 text-slate-400 border-white/10 hover:border-purple-500/40 hover:text-white'
                }`}
              >
                {filter.label}
              </button>
            ))}
          </div>

          {/* Bento Grid */}
          <div className="grid grid-cols-12 gap-6 relative z-10">
            {skillsData.map((category, idx) => (
              <SkillBentoCard 
                key={category.id} 
                category={category} 
                index={idx} 
                activeFilter={activeFilter} 
              />
            ))}
          </div>
        </section>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<SkillsSection />);
  </script>

</html>
